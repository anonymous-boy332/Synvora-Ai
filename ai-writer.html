<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synvora AI Writer</title>

    <!-- Business OS ke shared layout/sidebar styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/sidebar-toggle.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/business-os.css">
</head>

<body>

    <div class="dashboard writer-page">

        <div class="mobile-menu-head">
            <button
                class="menu-toggle"
                type="button"
                onclick="toggleSidebar()"
                aria-label="Toggle sidebar"
            >
                ☰
            </button>
        </div>

        <!-- Shared Sidebar -->
        <aside class="ai-sidebar">
            <div id="sidebar-container"></div>
        </aside>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Main Writer Area -->
        <main class="main-dashboard writer-main">

            <header class="ai-header">
                <h1>AI Writer</h1>

                <button
                    type="button"
                    onclick="window.location.href='dashboard.html'"
                >
                    Dashboard
                </button>
            </header>

            <section class="writer-box">
                <h2>Create Content With AI</h2>
                <p>Tell Synvora what you want to write.</p>

                <select id="writerType">
                    <option value="blog">📝 Blog Post</option>
                    <option value="email">📧 Email</option>
                    <option value="caption">📱 Social Media Caption</option>
                    <option value="marketing">📢 Marketing Copy</option>
                    <option value="proposal">💼 Business Proposal</option>
                    <option value="youtube">🎥 YouTube Script</option>
                    <option value="product">🛒 Product Description</option>
                </select>

                <textarea
                    id="writerPrompt"
                    placeholder="Example: Write a professional blog about Artificial Intelligence in Business."
                ></textarea>

                <button
                    class="generate-btn"
                    id="generateWriter"
                    type="button"
                >
                    ✨ Generate Content
                </button>
            </section>

            <section class="writer-result">
                <h2>Generated Content</h2>

                <div class="result-box" id="writerResult">
                    Your AI generated content will appear here...
                </div>
            </section>

        </main>
    </div>

    <!-- Shared sidebar loader and toggle -->
    <script src="script.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/sidebar-toggle.js"></script>

</body>
</html>
