<section class="customer-table">

    <div class="section-header">

        <div>

            <span class="settings-eyebrow">
                CRM MANAGEMENT
            </span>

            <h2>
                👥 Customer Directory
            </h2>

        </div>


        <button
            type="button"
            class="primary-btn"
            id="customerTableAddBtn">

            ➕ Add Customer

        </button>

    </div>


    <div class="customer-table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Company</th>

                    <th>Email</th>

                    <th>Phone</th>

                    <th>Status</th>

                    <th>Orders</th>

                    <th>Join Date</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="customerTableBody">

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center; padding:30px;">

                        Loading customers...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>
