<section class="active-workspace">

    <div class="active-workspace-left">

        <div class="active-workspace-icon">
            🏢
        </div>

        <div class="active-workspace-info">

            <span class="active-workspace-eyebrow">
                ACTIVE WORKSPACE
            </span>

            <h2 id="activeWorkspaceName">
                No Company Selected
            </h2>

            <p id="activeWorkspaceMeta">
                Select a company to activate its workspace.
            </p>

        </div>

    </div>


    <div class="active-workspace-right">

        <span
            id="activeWorkspaceStatus"
            class="workspace-status">

            ⚪ No Workspace

        </span>


        <button
            class="workspace-open-btn"
            onclick="openActiveCompanyWorkspace()">

            Open Workspace →

        </button>

    </div>

</section>
