<section class="employee-dashboard">

    <div class="section-header">

        <h2>👨‍💼 Employee Dashboard</h2>

        <button class="secondary-btn" id="employeeAttendanceBtn">
    ⏰ Attendance
</button>

        <button class="primary-btn" id="addEmployeeBtn">
            ➕ Add Employee
        </button>

    </div>

    <div class="employee-grid">

        <!-- Total Employees -->
        <div class="employee-card">

            <h3>👨‍💼 Total Employees</h3>

            <h1 id="totalEmployees">156</h1>

            <p>Team Members</p>

            <small class="positive" id="newEmployees">
                ▲ +8 New Employees
            </small>

        </div>


        <!-- Active Employees -->
        <div class="employee-card">

            <h3>🟢 Active Employees</h3>

            <h1 id="activeEmployees">142</h1>

            <p>Currently Working</p>

            <small id="activeWorkforce">
                91% Workforce Active
            </small>

        </div>


        <!-- Tasks Completed -->
        <div class="employee-card">

            <h3>📋 Tasks Completed</h3>

            <h1 id="completedTasks">864</h1>

            <p>This Month Tasks</p>

            <small class="positive" id="completionRate">
                94% Completion Rate
            </small>

        </div>


        <!-- Attendance -->
        <div class="employee-card">

            <h3>⏰ Attendance Rate</h3>

            <h1 id="attendanceRate">96%</h1>

            <p>Monthly Attendance</p>

            <small id="attendanceStatus">
                Excellent Attendance
            </small>

        </div>

    </div>

</section>
