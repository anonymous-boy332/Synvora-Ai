<section class="team-permissions">

    <div class="team-permissions-header">

        <div>

            <span class="settings-eyebrow">
                SECURITY & ACCESS
            </span>

            <h2>
                👥 Team Permissions
            </h2>

            <p>
                Manage employee roles and workspace access.
            </p>

        </div>

        <button
            type="button"
            class="secondary-btn"
            onclick="closeTeamPermissions()">

            ← Back to Settings

        </button>

    </div>


    <!-- ROLE INFORMATION -->

    <div class="permissions-info-card">

        <div class="permissions-info-icon">
            🛡️
        </div>

        <div>

            <h3>
                Role Based Access Control
            </h3>

            <p>
                Control what each team member can access
                inside this company workspace.
            </p>

        </div>

    </div>


    <!-- TEAM MEMBERS -->

    <div class="permissions-section">

        <div class="permissions-section-header">

            <div>

                <span class="settings-eyebrow">
                    TEAM MEMBERS
                </span>

                <h3>
                    Employee Access
                </h3>

            </div>

        </div>


        <div
    id="teamPermissionsList"
    class="team-permissions-list">

    <!-- Employees will load here -->

</div>

    </div>

</section>
