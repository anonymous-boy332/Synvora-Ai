<section class="crm-toolbar">

    <div class="toolbar-search">
        <input
            type="text"
            id="crmSearchInput"
            placeholder="Search customers, email, phone..."
            autocomplete="off"
            aria-label="Search customers"
        >
    </div>

    <div class="toolbar-actions">

        <button
            type="button"
            class="search-btn"
            id="crmSearchBtn"
        >
            🔍 Search
        </button>

        <button
            type="button"
            class="primary-btn"
            id="addCustomerBtn"
        >
            ➕ Add Customer
        </button>

        <button
            type="button"
            class="export-btn"
            id="exportCustomersBtn"
        >
            📤 Export
        </button>

    </div>

</section>
