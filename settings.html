<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synvora AI — Account Settings</title>

    <!-- Business OS ke shared styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/sidebar-toggle.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/business-os.css">

    <!-- Settings page design -->
    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #070d16;
        }

        body {
            color: #eaf2fc;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .ai-workspace {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 15% 0%, rgba(0, 174, 239, .10), transparent 38%),
                #070d16;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .ai-workspace .ai-main {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .ai-workspace .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 26px;
            padding: 25px 28px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 20px;
            background: linear-gradient(135deg, #101b2a, #09121e);
            box-shadow: 0 18px 45px rgba(0, 0, 0, .24);
        }

        .ai-workspace .workspace-title h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 750;
            letter-spacing: -.5px;
        }

        .ai-workspace .workspace-title p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, .62);
            font-size: 14px;
            line-height: 1.6;
        }

        .ai-workspace .workspace-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-workspace .workspace-actions button {
            min-height: 43px;
            padding: 0 16px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 650;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .ai-workspace .workspace-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 174, 239, .16);
        }

        .ai-workspace .workspace-actions .secondary {
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(255, 255, 255, .06);
            color: #eaf2fc;
        }

        .ai-workspace .workspace-actions .primary {
            border: 1px solid rgba(255, 215, 0, .35);
            background: rgba(255, 215, 0, .10);
            color: #ffd700;
        }

        .ai-workspace .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .ai-workspace .settings-grid > .settings-card {
            position: relative;
            overflow: hidden;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 19px;
            background: linear-gradient(145deg, #101a28, #0a121e);
            box-shadow: 0 15px 38px rgba(0, 0, 0, .22);
            transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
        }

        .ai-workspace .settings-grid > .settings-card::before {
            position: absolute;
            top: 0;
            right: 24px;
            left: 24px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00aeef, #ffd700, transparent);
            content: "";
        }

        .ai-workspace .settings-grid > .settings-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 174, 239, .32);
            box-shadow: 0 20px 44px rgba(0, 0, 0, .3);
        }

        .ai-workspace .settings-card h2 {
            margin: 0 0 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        .ai-workspace .settings-card > label {
            display: block;
            margin: 15px 0 8px;
            color: rgba(255, 255, 255, .78);
            font-size: 13px;
            font-weight: 600;
        }

        .ai-workspace .settings-card > select,
        .ai-workspace .settings-card > input:not([type="checkbox"]) {
            box-sizing: border-box;
            width: 100%;
            min-height: 46px;
            margin: 0 0 12px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            outline: none;
            background: rgba(0, 0, 0, .24);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .ai-workspace .settings-card > select:focus,
        .ai-workspace .settings-card > input:not([type="checkbox"]):focus {
            border-color: #00aeef;
            box-shadow: 0 0 0 3px rgba(0, 174, 239, .13);
        }

        .ai-workspace .settings-card > select option {
            background: #0b1728;
            color: #fff;
        }

        .ai-workspace .settings-card input::placeholder {
            color: rgba(255, 255, 255, .42);
        }

        .ai-workspace .settings-card > label:has(input[type="checkbox"]) {
            display: flex;
            align-items: center;
            gap: 11px;
            margin: 0;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .07);
            color: rgba(255, 255, 255, .78);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .ai-workspace .settings-card > label:has(input[type="checkbox"]) input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: #00aeef;
        }

        .ai-workspace .settings-card .generate-btn {
            width: 100%;
            min-height: 45px;
            margin-top: 16px;
            border: 1px solid rgba(0, 174, 239, .45);
            border-radius: 10px;
            background: linear-gradient(135deg, #00aeef, #0788bf);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .ai-workspace .settings-card .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 24px rgba(0, 174, 239, .24);
        }

        @media (max-width: 760px) {
            .ai-workspace .ai-main {
                padding: 18px;
            }

            .ai-workspace .ai-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 21px;
            }

            .ai-workspace .workspace-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .ai-workspace .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 420px) {
            .ai-workspace .settings-grid > .settings-card {
                padding: 21px;
            }

            .ai-workspace .workspace-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Business OS jaisa shared page/sidebar structure -->
    <div class="dashboard ai-workspace">

        <div class="mobile-menu-head">
            <button
                class="menu-toggle"
                type="button"
                onclick="toggleSidebar()"
                aria-label="Toggle navigation"
            >
                ☰
            </button>
        </div>

        <aside class="ai-sidebar">
            <div id="sidebar-container"></div>
        </aside>

        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-dashboard ai-main">

            <header class="ai-header">
                <div class="workspace-title">
                    <h1>⚙ Account Settings</h1>
                    <p>Customize your Synvora AI experience.</p>
                </div>

                <div class="workspace-actions">
                    <a href="dashboard.html">
                        <button class="secondary" type="button">🏠 Dashboard</button>
                    </a>

                    <button class="primary" type="button">⭐ Synvora Pro</button>
                </div>
            </header>

            <div class="settings-grid">

                <section class="settings-card">
                    <h2>🌍 General Settings</h2>

                    <label for="settingsLanguage">Language</label>
                    <select id="settingsLanguage">
                        <option>English</option>
                        <option>Urdu</option>
                        <option>Arabic</option>
                    </select>

                    <label for="settingsTheme">Theme</label>
                    <select id="settingsTheme">
                        <option>Dark</option>
                        <option>Light</option>
                        <option>System Default</option>
                    </select>

                    <button class="generate-btn" type="button">Save Settings</button>
                </section>

                <section class="settings-card">
                    <h2>🔔 Notifications</h2>

                    <label>
                        <input type="checkbox" checked>
                        Email Notifications
                    </label>

                    <label>
                        <input type="checkbox" checked>
                        Marketing Emails
                    </label>

                    <label>
                        <input type="checkbox">
                        AI Updates
                    </label>

                    <button class="generate-btn" type="button">Update Notifications</button>
                </section>

                <section class="settings-card">
                    <h2>🔒 Security</h2>

                    <input type="password" placeholder="Current Password" aria-label="Current Password">
                    <input type="password" placeholder="New Password" aria-label="New Password">
                    <input type="password" placeholder="Confirm Password" aria-label="Confirm Password">

                    <button class="generate-btn" type="button">💾 Update Password</button>
                </section>

                <section class="settings-card">
                    <h2>🔑 API Configuration</h2>

                    <input type="text" placeholder="OpenAI API Key" aria-label="OpenAI API Key">
                    <input type="text" placeholder="Gemini API Key" aria-label="Gemini API Key">

                    <button class="generate-btn" type="button">Save API Keys</button>
                </section>

            </div>
        </main>
    </div>

    <!-- Wohi shared sidebar loader aur toggle jo Business OS mein hain -->
    <script src="js/sidebar.js"></script>
    <script src="js/sidebar-toggle.js"></script>

</body>
</html>
