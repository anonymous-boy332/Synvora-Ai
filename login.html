<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Synvora AI Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">

            Synvora<span>AI</span>

        </div>


        <h2>
            Welcome Back
        </h2>


        <p>
            Login to your AI workspace
        </p>




        <form id="loginForm">


            <input 
            type="email"
            id="email"
            placeholder="Enter Email"
            required>



            <div class="password-box">

<input 
type="password"
id="password"
placeholder="Enter Password"
required>

<span id="togglePassword">
👁
</span>

</div>


<p id="loginMessage"></p>

            <button type="submit">

                Sign In

            </button>



        </form>




        <div class="auth-link">


            Don't have an account?


            <a href="register.html">

                Create Account

            </a>


        </div>



    </div>


</div>



<script type="module" src="supabase.js"></script>

<script type="module" src="auth.js"></script>


</body>

</html>
